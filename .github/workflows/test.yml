name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: butler
          POSTGRES_PASSWORD: butler
          POSTGRES_DB: butler_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U butler"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://butler:butler@localhost:5432/butler_test
          DEEPSEEK_API_KEY: test
      - run: uv run pytest -q --ignore=tests/integration
        env:
          DATABASE_URL: postgresql+asyncpg://butler:butler@localhost:5432/butler_test
          REDIS_URL: redis://localhost:6379/0
          DEEPSEEK_API_KEY: test
