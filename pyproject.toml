[project]
name = "personal-butler-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "apscheduler>=3.10.0",
    "cryptography>=44.0.0",
    "greenlet>=3.5.1",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
    "html2text>=2024.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "redis>=5.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pyyaml>=6.0",
]

[project.scripts]
butler-ingest-knowledge = "src.cli.ingest_knowledge:run"
butler-migrate-to-chroma = "src.cli.migrate_to_chroma:run"
butler-migrate-sqlite-to-postgres = "src.cli.migrate_sqlite_to_postgres:run"
butler-evaluate-research = "src.cli.evaluate_research:run"

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
